# The esp-idf-atoms3r image: esp-idf-atoms3r/ in this repo, published as ghcr.io/<owner>/<repo>/esp-idf-atoms3r.
name: esp-idf-atoms3r

on:
  push:
    branches: [main]
    paths:
      - esp-idf-atoms3r/**
      - .github/workflows/esp-idf-atoms3r.yml
      - .github/workflows/image.yml
  pull_request:
    paths:
      - esp-idf-atoms3r/**
      - .github/workflows/esp-idf-atoms3r.yml
      - .github/workflows/image.yml
  workflow_dispatch:

concurrency:
  group: esp-idf-atoms3r-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    uses: ./.github/workflows/image.yml
    with:
      image: esp-idf-atoms3r
      version_arg: IDF_VERSION
      smoke_test: atoms3r-smoke-test
      description: ESP-IDF v5.5.6 for the M5Stack AtomS3R + Atomic Echo Base (ESP32-S3), with esp_codec_dev and atoms3r-build
