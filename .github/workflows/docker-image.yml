# Builds the Zephyr image for amd64 + arm64 on native runners, runs the smoke
# test on each architecture, then publishes a multi-arch image to GHCR:
#   ghcr.io/<owner>/<repo>:latest | :zephyr-vX.Y.Z | :sha-<short> | :<git tag>
# The run summary prints the pinned reference (image@sha256:...) for DOP.
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - Dockerfile
      - .dockerignore
      - scripts/**
      - .github/workflows/docker-image.yml
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Free disk space
        run: |
          # The unpacked image is ~10 GB; hosted runners need room for the build cache too
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /usr/local/share/boost /opt/hostedtoolcache || true
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v7

      - name: Set image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      # Pushed by digest only (no tag); tags are added in the publish job after tests pass
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          # J-Link stays out of the public image: SEGGER's license does not allow redistribution
          build-args: |
            INSTALL_JLINK=false
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }},mode=max
          provenance: false
          sbom: false

      - name: Save digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          echo "${{ steps.build.outputs.digest }}" > "${RUNNER_TEMP}/digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          retention-days: 1

  test:
    name: Smoke test (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /usr/local/share/boost /opt/hostedtoolcache || true
          sudo docker image prune --all --force

      - name: Set image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build hello_world for all families and run it in QEMU
        run: |
          DIGEST=$(cat "${RUNNER_TEMP}/digests/${{ matrix.arch }}")
          docker run --rm "${IMAGE}@${DIGEST}" zephyr-smoke-test

  publish:
    name: Publish multi-arch image
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set image name and Zephyr version
        run: |
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "ZEPHYR_VERSION=$(sed -n 's/^ARG ZEPHYR_VERSION=//p' Dockerfile)" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=zephyr-${{ env.ZEPHYR_VERSION }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Create manifest list and push tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags=(); while read -r t; do tags+=(-t "$t"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=(); for f in *; do sources+=("${IMAGE}@$(cat "$f")"); done
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.description=Zephyr ${ZEPHYR_VERSION} + SDK for QEMU, nRF, STM32, ESP32" \
            "${sources[@]}"

      - name: Summary
        run: |
          TAG="${IMAGE}:sha-${GITHUB_SHA::7}"
          DIGEST=$(docker buildx imagetools inspect "$TAG" --format '{{json .Manifest}}' | jq -r .digest)
          {
            echo "## Published image"
            echo
            echo "Pinned reference (use this as the DOP base image):"
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo "Tags:"
            echo '```'
            jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "$TAG"
