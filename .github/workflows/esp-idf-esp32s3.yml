# The esp-idf-esp32s3 image: esp-idf-esp32s3/ in this repo, published as ghcr.io/<owner>/<repo>/esp-idf-esp32s3.
name: esp-idf-esp32s3

on:
  push:
    branches: [main]
    paths:
      - esp-idf-esp32s3/**
      - .github/workflows/esp-idf-esp32s3.yml
      - .github/workflows/image.yml
  pull_request:
    paths:
      - esp-idf-esp32s3/**
      - .github/workflows/esp-idf-esp32s3.yml
      - .github/workflows/image.yml
  workflow_dispatch:

concurrency:
  group: esp-idf-esp32s3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    uses: ./.github/workflows/image.yml
    with:
      image: esp-idf-esp32s3
      version_arg: IDF_VERSION
      smoke_test: esp32s3-smoke-test
      description: ESP-IDF v5.5.6 for the ESP32-S3 (Adafruit Feather ESP32-S3 Reverse TFT), with esp32s3-build
