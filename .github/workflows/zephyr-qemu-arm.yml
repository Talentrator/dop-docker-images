# The zephyr-qemu-arm image: zephyr-qemu-arm/ in this repo, published as ghcr.io/<owner>/<repo>/zephyr-qemu-arm.
name: zephyr-qemu-arm

on:
  push:
    branches: [main]
    paths:
      - zephyr-qemu-arm/**
      - .github/workflows/zephyr-qemu-arm.yml
      - .github/workflows/image.yml
  pull_request:
    paths:
      - zephyr-qemu-arm/**
      - .github/workflows/zephyr-qemu-arm.yml
      - .github/workflows/image.yml
  workflow_dispatch:

concurrency:
  group: zephyr-qemu-arm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    uses: ./.github/workflows/image.yml
    with:
      image: zephyr-qemu-arm
      version_arg: ZEPHYR_VERSION
      smoke_test: zephyr-smoke-test
      description: Zephyr + SDK for the Arm QEMU boards only
